<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kestrel Freight — Security Posture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E13; --panel:#10151C; --panel-alt:#161D26; --border:#232B36; --border-soft:#1A212B;
    --text:#E7ECF2; --text-muted:#8B96A5; --text-dim:#56616F;
    --critical:#E5484D; --high:#F0883E; --medium:#E9C349; --low:#5B8DB8; --good:#3FB966; --accent:#4FA8E0;
    --sans:'IBM Plex Sans',-apple-system,sans-serif; --mono:'IBM Plex Mono','SF Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; height:100%;}
  ::selection{background:rgba(79,168,224,0.25);}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  a{color:var(--accent);}

  /* ---------- Login ---------- */
  #loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login-card{width:360px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:32px;}
  .login-logo{display:flex; align-items:center; gap:10px; margin-bottom:28px;}
  .login-logo svg{width:26px; height:26px;}
  .login-logo .t1{font-weight:600; font-size:15px;}
  .login-logo .t2{color:var(--text-dim); font-size:12px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:6px;}
  .field input{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:9px 11px; outline:none;}
  .field input:focus{border-color:var(--accent);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--accent); color:#06121C; font-weight:600; border:none; padding:9px 16px; border-radius:5px; cursor:pointer; font-size:13px;}
  .btn:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:0.5; cursor:default;}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text-muted);}
  .btn.ghost:hover{background:var(--panel-alt); color:var(--text);}
  .btn.danger{background:var(--critical); color:#fff;}
  .btn.small{padding:5px 10px; font-size:11.5px; border-radius:4px;}
  .btn.block{width:100%;}
  .login-error{color:var(--critical); font-size:12px; margin-top:10px; min-height:16px;}
  .login-hint{color:var(--text-dim); font-size:11.5px; margin-top:18px; line-height:1.6; border-top:1px solid var(--border-soft); padding-top:14px;}
  .login-hint code{font-family:var(--mono); color:var(--text-muted);}

  /* ---------- App shell ---------- */
  #app{display:none; grid-template-columns:64px 1fr; grid-template-rows:56px 1fr; min-height:100vh; grid-template-areas:"rail top" "rail main";}
  .rail{grid-area:rail; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:16px 0; gap:4px;}
  .rail-logo{width:32px; height:32px; margin-bottom:20px; display:flex; align-items:center; justify-content:center;}
  .rail-item{width:40px; height:40px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; position:relative; transition:background .15s, color .15s;}
  .rail-item:hover{background:var(--panel-alt); color:var(--text-muted);}
  .rail-item.active{color:var(--accent); background:rgba(79,168,224,0.1);}
  .rail-item.active::before{content:""; position:absolute; left:-16px; top:8px; bottom:8px; width:2px; background:var(--accent);}
  .rail-item svg{width:19px; height:19px;}
  .rail-spacer{flex:1;}

  .topbar{grid-area:top; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; gap:16px;}
  .org{display:flex; align-items:center; gap:10px; font-weight:600; font-size:14.5px;}
  .live-dot{width:6px; height:6px; border-radius:50%; background:var(--good); box-shadow:0 0 0 0 rgba(63,185,102,.6); animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,102,.5);}70%{box-shadow:0 0 0 6px rgba(63,185,102,0);}100%{box-shadow:0 0 0 0 rgba(63,185,102,0);}}
  .org-sub{color:var(--text-dim); font-weight:400; font-size:12.5px;}
  .topbar-spacer{flex:1;}
  .role-badge{font-family:var(--mono); font-size:11px; color:var(--text-muted); border:1px solid var(--border); padding:3px 8px; border-radius:3px;}
  .avatar{width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#2E4A63,#1B2E40); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; color:var(--text-muted); margin-left:6px; cursor:pointer;}

  .main{grid-area:main; padding:28px 32px 60px; overflow-y:auto;}
  .page-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  .page-head h1{font-size:19px; font-weight:600;}
  .page-head .sub{color:var(--text-dim); font-size:12.5px; margin-top:2px;}

  .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:16px;}
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:20px;}
  .panel-title{font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:16px; display:flex; align-items:center; justify-content:space-between;}
  .panel-title .hint{font-weight:400; color:var(--text-dim); font-size:11.5px;}

  .hero{grid-column:span 5;}
  .hero-body{display:flex; align-items:center; gap:24px;}
  .gauge-wrap{position:relative; width:150px; height:150px; flex-shrink:0;}
  .gauge-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-num .n{font-family:var(--mono); font-size:36px; font-weight:600;}
  .gauge-num .d{font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:2px;}
  .hero-side{flex:1; min-width:0;}
  .rating{font-size:14px; font-weight:600; margin-bottom:4px;}
  .trend-line{font-size:12.5px; color:var(--text-muted); display:flex; align-items:center; gap:5px; margin-bottom:16px;}
  .trend-line .up{color:var(--good); font-weight:600;} .trend-line .down{color:var(--critical); font-weight:600;}
  .cat-list{display:flex; flex-direction:column; gap:9px;}
  .cat-row{display:grid; grid-template-columns:118px 1fr 30px; align-items:center; gap:10px;}
  .cat-name{font-size:12px; color:var(--text-muted);}
  .cat-bar{height:5px; background:var(--border-soft); border-radius:3px; overflow:hidden;}
  .cat-bar-fill{height:100%; width:0; border-radius:3px; transition:width 1s cubic-bezier(.2,.8,.2,1);}
  .cat-score{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); text-align:right;}

  .strip{grid-column:span 7; display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
  .stat-panel{background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:18px;}
  .stat-head{font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:14px;}
  .stat-rows{display:flex; flex-direction:column; gap:10px;}
  .stat-row{display:flex; align-items:center; justify-content:space-between;}
  .stat-label{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-muted);}
  .dot{width:7px; height:7px; border-radius:2px; flex-shrink:0;}
  .stat-val{font-family:var(--mono); font-size:13px; font-weight:600;}
  .stat-total{margin-top:12px; padding-top:12px; border-top:1px solid var(--border-soft); display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim);}
  .stat-total b{color:var(--text); font-family:var(--mono);}

  .priorities{grid-column:span 12;}
  .pr-row{display:grid; grid-template-columns:28px 90px 1fr 170px 90px; align-items:center; gap:14px; padding:12px 4px; border-bottom:1px solid var(--border-soft);}
  .pr-row:last-child{border-bottom:none;}
  .pr-rank{font-family:var(--mono); color:var(--text-dim); font-size:12px;}
  .sev-tag{font-family:var(--mono); font-size:10.5px; font-weight:600; padding:3px 7px; border-radius:3px; text-align:center; width:fit-content;}
  .sev-critical{color:var(--critical); background:rgba(229,72,77,.12); border:1px solid rgba(229,72,77,.3);}
  .sev-high{color:var(--high); background:rgba(240,136,62,.12); border:1px solid rgba(240,136,62,.3);}
  .sev-medium{color:var(--medium); background:rgba(233,195,73,.12); border:1px solid rgba(233,195,73,.3);}
  .sev-low{color:var(--low); background:rgba(91,141,184,.12); border:1px solid rgba(91,141,184,.3);}
  .pr-title{font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pr-asset{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pr-action{font-size:11.5px; color:var(--accent); border:1px solid rgba(79,168,224,.3); padding:5px 10px; border-radius:4px; cursor:pointer; background:rgba(79,168,224,.06); text-align:center; width:fit-content; justify-self:end;}
  .pr-action:hover{background:rgba(79,168,224,.14);}

  .pipeline{grid-column:span 7;}
  .pipe-stages{display:flex; align-items:flex-end; gap:2px; height:110px; margin-top:6px;}
  .pipe-stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:8px;}
  .pipe-bar{width:100%; max-width:34px; border-radius:3px 3px 0 0; opacity:.85; height:0; transition:height .9s cubic-bezier(.2,.8,.2,1);}
  .pipe-count{font-family:var(--mono); font-size:12px; font-weight:600;}
  .pipe-label{font-size:9.5px; color:var(--text-dim); text-align:center; line-height:1.3; margin-top:2px;}

  .trend{grid-column:span 5;}
  .trend-legend{display:flex; justify-content:space-between; margin-top:6px; font-family:var(--mono); font-size:10.5px; color:var(--text-dim);}

  /* ---------- Tables (Findings / Assets) ---------- */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
  .toolbar select, .toolbar input{background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:7px 10px; font-size:12.5px;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; color:var(--text-dim); font-weight:500; font-size:11px; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  tr:hover td{background:rgba(255,255,255,0.015);}
  .risk-val{font-family:var(--mono); font-weight:600;}
  .status-pill{font-family:var(--mono); font-size:10.5px; padding:3px 8px; border-radius:10px; border:1px solid var(--border); color:var(--text-muted); white-space:nowrap;}
  .status-resolved{color:var(--good); border-color:rgba(63,185,102,.35);}
  .status-detected{color:var(--text-muted);}
  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--text-dim);}

  /* ---------- Modal ---------- */
  .modal-backdrop{display:none; position:fixed; inset:0; background:rgba(4,6,9,0.65); align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal{width:480px; max-width:100%; max-height:85vh; overflow-y:auto; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:24px;}
  .modal h3{font-size:15px; margin-bottom:16px;}
  .modal .field textarea{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:9px 11px; outline:none; resize:vertical; min-height:70px;}
  .modal .field select{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:9px 11px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .event-log{margin-top:16px; border-top:1px solid var(--border-soft); padding-top:14px;}
  .event-item{padding:8px 0; border-bottom:1px solid var(--border-soft); font-size:12px;}
  .event-item:last-child{border-bottom:none;}
  .event-meta{color:var(--text-dim); font-family:var(--mono); font-size:10.5px; margin-top:2px;}

  .toast{position:fixed; bottom:20px; right:20px; background:var(--panel-alt); border:1px solid var(--border); border-left:3px solid var(--accent); padding:12px 16px; border-radius:6px; font-size:12.5px; z-index:100; max-width:320px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .toast.error{border-left-color:var(--critical);}

  @media (max-width:1180px){
    .hero,.strip,.pipeline,.trend{grid-column:span 12;}
    .strip{grid-template-columns:1fr;}
    .main{padding:20px;}
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4FA8E0" stroke-width="1.6"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
      <div><div class="t1">Kestrel Freight</div><div class="t2">Security Posture Platform</div></div>
    </div>
    <form id="loginForm">
      <div class="field"><label>Username</label><input type="text" id="loginUsername" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
      <button type="submit" class="btn block" id="loginBtn">Sign in</button>
      <div class="login-error" id="loginError"></div>
    </form>
    <div class="login-hint">
      Demo accounts (seeded): <code>admin/admin123</code> (admin),
      <code>jrivera/analyst123</code> (analyst), <code>viewer/viewer123</code> (viewer).
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app">
  <div class="rail">
    <div class="rail-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#4FA8E0" stroke-width="1.6"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg></div>
    <div class="rail-item" data-route="dashboard" title="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
    </div>
    <div class="rail-item" data-route="assets" title="Assets">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><circle cx="7" cy="7" r="0.6" fill="currentColor"/><circle cx="7" cy="17" r="0.6" fill="currentColor"/></svg>
    </div>
    <div class="rail-item" data-route="findings" title="Findings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l9 16H3L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="16.7" r="0.6" fill="currentColor"/></svg>
    </div>
    <div class="rail-item" data-route="reports" title="Reports & Import">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M9.5 13h5M9.5 16.5h5"/></svg>
    </div>
    <div class="rail-spacer"></div>
    <div class="rail-item" data-route="admin" title="Admin" id="adminNavItem" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
    </div>
  </div>

  <div class="topbar">
    <div class="org"><span class="live-dot"></span>Kestrel Freight <span class="org-sub">— Security Posture</span></div>
    <div class="topbar-spacer"></div>
    <div class="role-badge" id="roleBadge">—</div>
    <div class="avatar" id="avatarBtn" title="Sign out">--</div>
  </div>

  <div class="main" id="mainContent"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBody"></div></div>
<div id="toastHost"></div>

<script src="app.js"></script>
</body>
</html>
